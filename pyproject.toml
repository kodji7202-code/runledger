[build-system]
# setuptools 77 is the first release that accepts the SPDX `license` string (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "runledger"
version = "0.1.0"
description = "A black box recorder for AI coding agents: turn Claude Code runs into shareable receipts."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "RunLedger", email = "hello@runledger.site" }]
keywords = ["ai", "coding-agents", "claude-code", "codex", "aider", "audit", "receipts", "guardrails", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://runledger.site"

[project.scripts]
runledger = "runledger.cli:main"

[tool.setuptools]
packages = ["runledger", "runledger.server", "runledger.adapters"]

[tool.setuptools.package-data]
runledger = ["prices.json"]
