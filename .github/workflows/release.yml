# Release: when a tag such as v0.3.0 is pushed, build the sdist and wheel and publish them to PyPI.
#
# One-time setup, before the first release: create the "runledger-ai" project on PyPI, then add
# this repository, the workflow file name "release.yml" and the environment "pypi" as a trusted
# publisher (PyPI: project > Settings > Publishing). After that, no API token is needed.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check that the wheel version matches the tag
        run: test -f "dist/runledger_ai-${GITHUB_REF_NAME#v}-py3-none-any.whl"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/runledger-ai
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
