# Release: pushing a tag such as v0.6.1 tests the commit, builds the sdist and wheel, publishes
# them to PyPI and creates the GitHub Release from the CHANGELOG section of that version.
#
# The tag must match pyproject.toml, runledger/__init__.py and CHANGELOG.md, and its commit must
# already be on main; tools/check_release.py enforces the first part before anything is built.
#
# One-time setup, before the first release: create the "runledger-ai" project on PyPI, then add
# this repository, the workflow file name "release.yml" and the environment "pypi" as a trusted
# publisher (PyPI: project > Settings > Publishing). After that, no API token is needed.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Test, build and smoke release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the tag's commit is checked against origin/main below
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check the tag against the version files and the CHANGELOG
        run: python tools/check_release.py --tag "$GITHUB_REF_NAME"
      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Run tests
        run: |
          python -m pip install pytest
          python -m pytest -q
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Smoke-test the tagged wheel
        run: |
          wheel="dist/runledger_ai-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          test -f "$wheel"
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install "$wheel"
          test "$(.release-smoke/bin/runledger --version)" = "runledger ${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/runledger-ai
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  release:
    name: Create the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that writes to the repository: it creates the release after PyPI succeeded.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create the release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/check_release.py --tag "$GITHUB_REF_NAME" --notes | gh release create "$GITHUB_REF_NAME" --notes-file - --title "RunLedger ${GITHUB_REF_NAME#v}"
