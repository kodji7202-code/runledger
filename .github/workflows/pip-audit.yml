name: Dependency audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install RunLedger
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e '.[server,saml]'
      - name: Install isolated audit tooling
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip install pip-audit
      - name: Audit installed dependencies
        run: |
          site_packages="$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip_audit --path "$site_packages" --skip-editable --progress-spinner off
