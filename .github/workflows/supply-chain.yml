name: Supply chain

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [Dockerfile, pyproject.toml, .github/workflows/supply-chain.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Generate and validate package SBOM
        run: |
          python -m venv .package-venv
          .package-venv/bin/python -m pip install '.[server,saml]'
          python -m venv .sbom-venv
          .sbom-venv/bin/python -m pip install cyclonedx-bom==7.2.1
          .sbom-venv/bin/cyclonedx-py environment .package-venv/bin/python --of JSON -o runledger-python.cdx.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("runledger-python.cdx.json")
          assert path.stat().st_size > 0
          bom = json.loads(path.read_text())
          assert bom["bomFormat"] == "CycloneDX" and bom["components"]
          assert any(c["name"] == "runledger-ai" for c in bom["components"])
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-sbom
          path: runledger-python.cdx.json
          if-no-files-found: error

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Check out the image source.
      packages: write # Push release images to GHCR.
      id-token: write # Keyless cosign signing and attestation identity via OIDC.
      attestations: write # Store build and SBOM attestations on GitHub.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # a release tag's commit is checked against origin/main below
      - name: Image metadata
        id: meta
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
            # Same check as release.yml: a tag on a commit that is not on main publishes nothing.
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          push: ${{ steps.meta.outputs.release == 'true' }}
          load: ${{ steps.meta.outputs.release != 'true' }}
          tags: |
            ${{ steps.meta.outputs.name }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.release == 'true' && format('{0}:{1}', steps.meta.outputs.name, github.ref_name) || 'runledger:supply-chain' }}
          build-args: |
            PYTHON_BASE_IMAGE=public.ecr.aws/docker/library/python:3.12-slim
            RUNLEDGER_VERSION=${{ steps.meta.outputs.version }}
            RUNLEDGER_REVISION=${{ github.sha }}
      - name: Smoke-test unpublished image
        if: steps.meta.outputs.release != 'true'
        run: |
          docker run -d --name runledger-supply-chain -p 127.0.0.1:8787:8787 runledger:supply-chain
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health; then exit 0; fi
            sleep 1
          done
          docker logs runledger-supply-chain
          exit 1
      - name: Remove test container
        if: always() && steps.meta.outputs.release != 'true'
        run: docker rm -f runledger-supply-chain || true
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.meta.outputs.release == 'true' && format('registry:{0}@{1}', steps.meta.outputs.name, steps.build.outputs.digest) || 'docker:runledger:supply-chain' }}
          format: cyclonedx-json
          syft-version: v1.38.0
          output-file: runledger-image.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Validate image SBOM
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("runledger-image.cdx.json")
          assert path.stat().st_size > 0
          bom = json.loads(path.read_text())
          assert bom["bomFormat"] == "CycloneDX" and bom["components"]
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-sbom
          path: runledger-image.cdx.json
          if-no-files-found: error
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      - name: Sign image digest
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE: ${{ steps.meta.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          subject-name: ${{ steps.meta.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          subject-name: ${{ steps.meta.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: runledger-image.cdx.json
          push-to-registry: true

  attach:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [sbom, image]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: '*-sbom'
          merge-multiple: true
          path: sboms
      - name: Wait for the publishing workflow's release and attach SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in $(seq 1 180); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" sboms/*.cdx.json --clobber
              exit 0
            fi
            sleep 10
          done
          echo 'Release was not created within 30 minutes' >&2
          exit 1
