name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install RunLedger and pytest
        run: python -m pip install -e . pytest
      - name: Run tests
        run: pytest -q

  py39-compile:
    name: Byte-compile on Python 3.9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Byte-compile the package
        run: python -m compileall -q runledger

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        # Docker Hub regularly rate-limits shared GitHub-hosted runner IPs.
        # Use the official Python image's public ECR mirror for this CI build.
        run: docker build --build-arg PYTHON_BASE_IMAGE=public.ecr.aws/docker/library/python:3.12-slim -t runledger:ci .
      - name: Run the image and check /health
        run: |
          docker run -d --name runledger-ci -p 127.0.0.1:8787:8787 runledger:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            docker logs runledger-ci
            exit 1
          fi
      - name: Remove the test container
        if: always()
        run: docker rm -f runledger-ci || true
