name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # windows-latest runs the suite in 16-20 minutes; the v0.7.0 release saw three jobs cancelled
    # at a 20-minute limit with all tests passed, so the budget carries headroom for them.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install RunLedger and pytest
        run: python -m pip install -e . pytest
      - name: Byte-compile the package
        run: python -m compileall -q runledger
      - name: Run tests
        run: pytest -q -ra  # -ra lists skipped tests by name, so platform-only skips stay visible

  build:
    name: Build the distributions and check them
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Check the metadata of both distributions
        run: python -m twine check dist/*
      - name: Check the wheel ships every module and the package data
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = set(zipfile.ZipFile(str(wheel)).namelist())
          expected = [p.as_posix() for p in sorted(pathlib.Path("runledger").rglob("*.py"))
                      if "__pycache__" not in p.parts]
          expected += ["runledger/prices.json", "runledger/receipt.schema.json"]
          missing = [name for name in expected if name not in names]
          assert not missing, "missing from the wheel: %s" % missing
          print("%s ships all %d expected files" % (wheel.name, len(expected)))
          PY

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Lint the production compose file
        # The compose file requires both values; this step writes the stub env file Compose reads
        # next to it (gitignored) and exports the same two variables, so `config` validates the
        # real, hardened file without deploying anything. Docker and Compose are preinstalled on
        # the runner.
        env:
          RUNLEDGER_DOMAIN: runledger.example.com
          RUNLEDGER_PUBLIC_URL: https://runledger.example.com
        run: |
          env_file="$(dirname deploy/docker-compose.yml)/.env"
          printf 'RUNLEDGER_DOMAIN=%s\nRUNLEDGER_PUBLIC_URL=%s\n' "$RUNLEDGER_DOMAIN" "$RUNLEDGER_PUBLIC_URL" > "$env_file"
          docker compose -f deploy/docker-compose.yml config -q
      - name: Syntax-check the backup script
        # The script runs on the host (cron), where only POSIX tools can be assumed.
        run: bash -n deploy/backup.sh

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        # Registries rate-limit shared GitHub-hosted runner IPs (Docker Hub, and public ECR
        # with "429 Data limit exceeded"). Try the official image's mirrors in turn, with backoff.
        # The OCI labels get the real version and commit, so the built image is identifiable.
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          test -n "$version"
          for attempt in 1 2 3; do
            for base in public.ecr.aws/docker/library/python:3.12-slim mirror.gcr.io/library/python:3.12-slim python:3.12-slim; do
              echo "::group::attempt $attempt, base $base"
              if docker build --build-arg PYTHON_BASE_IMAGE="$base" --build-arg RUNLEDGER_VERSION="$version" --build-arg RUNLEDGER_REVISION="$GITHUB_SHA" -t runledger:ci .; then
                echo "::endgroup::"; exit 0
              fi
              echo "::endgroup::"
            done
            sleep $((attempt * 20))
          done
          exit 1
      - name: Check the OCI labels
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          test -n "$version"
          for key in title description licenses version revision source url; do
            value="$(docker inspect --format "{{ index .Config.Labels \"org.opencontainers.image.$key\" }}" runledger:ci)"
            if [ -z "$value" ]; then
              echo "the image has no org.opencontainers.image.$key label"
              exit 1
            fi
            echo "org.opencontainers.image.$key=$value"
          done
          label() { docker inspect --format "{{ index .Config.Labels \"$1\" }}" runledger:ci; }
          got="$(label org.opencontainers.image.version)"
          if [ "$got" != "$version" ]; then
            echo "the version label is $got, expected $version"
            exit 1
          fi
          got="$(label org.opencontainers.image.revision)"
          if [ "$got" != "$GITHUB_SHA" ]; then
            echo "the revision label is $got, expected $GITHUB_SHA"
            exit 1
          fi
      - name: Run the image and check /health
        run: |
          docker run -d --name runledger-ci -p 127.0.0.1:8787:8787 runledger:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            docker logs runledger-ci
            exit 1
          fi
      - name: Remove the test container
        if: always()
        run: docker rm -f runledger-ci || true
