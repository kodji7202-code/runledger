name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install RunLedger and pytest
        run: python -m pip install -e . pytest
      - name: Run tests
        run: pytest -q -ra  # -ra lists skipped tests by name, so platform-only skips stay visible

  py39-compile:
    name: Byte-compile on Python 3.9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Byte-compile the package
        run: python -m compileall -q runledger

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        # Registries rate-limit shared GitHub-hosted runner IPs (Docker Hub, and public ECR
        # with "429 Data limit exceeded"). Try the official image's mirrors in turn, with backoff.
        run: |
          for attempt in 1 2 3; do
            for base in public.ecr.aws/docker/library/python:3.12-slim mirror.gcr.io/library/python:3.12-slim python:3.12-slim; do
              echo "::group::attempt $attempt, base $base"
              if docker build --build-arg PYTHON_BASE_IMAGE="$base" -t runledger:ci .; then
                echo "::endgroup::"; exit 0
              fi
              echo "::endgroup::"
            done
            sleep $((attempt * 20))
          done
          exit 1
      - name: Run the image and check /health
        run: |
          docker run -d --name runledger-ci -p 127.0.0.1:8787:8787 runledger:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            docker logs runledger-ci
            exit 1
          fi
      - name: Remove the test container
        if: always()
        run: docker rm -f runledger-ci || true
