name: RunLedger receipt
description: Post a RunLedger risk receipt for Claude Code sessions as a sticky pull request comment, and fail the job above a risk threshold.
branding:
  icon: shield
  color: green
inputs:
  sessions-dir:
    description: Folder of Claude Code session .jsonl files to score (commit them there or copy them in before this step).
    required: false
    default: .runledger/sessions
  fail-on:
    description: Fail the job when the highest risk score is at or above this value (0-100). Leave empty to never fail.
    required: false
    default: "60"
  github-token:
    description: "Token that can write pull request comments (needs pull-requests: write)."
    required: false
    default: ${{ github.token }}
outputs:
  risk_score:
    description: Highest risk score across the sessions (0-100).
    value: ${{ steps.receipt.outputs.risk_score }}
  risk_level:
    description: Level of the highest risk score (Low, Medium or High).
    value: ${{ steps.receipt.outputs.risk_level }}
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install RunLedger
      shell: bash
      env:
        RUNLEDGER_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$RUNLEDGER_ACTION_PATH"
    - name: Post the RunLedger receipt
      id: receipt
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        RUNLEDGER_SESSIONS_DIR: ${{ inputs.sessions-dir }}
        RUNLEDGER_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        args=(--sessions-dir "$RUNLEDGER_SESSIONS_DIR")
        if [ -n "$RUNLEDGER_FAIL_ON" ]; then
          args+=(--fail-on "$RUNLEDGER_FAIL_ON")
        fi
        python -m runledger.github comment "${args[@]}"
