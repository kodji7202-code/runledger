name: RunLedger receipt
description: Post a RunLedger risk receipt for AI coding agent sessions (.jsonl, .runledger.json) as a sticky pull request comment, and fail the job above a risk threshold.
branding:
  icon: shield
  color: green
inputs:
  sessions-dir:
    description: >-
      Folder of AI coding agent session files to score: Claude Code, Codex and Factory Droid
      .jsonl transcripts, and .runledger.json written by any agent (commit them there or copy
      them in before this step). A Droid session needs its sibling .settings.json next to it
      for token usage and cost.
    required: false
    default: .runledger/sessions
  fail-on:
    description: Fail the job when the highest risk score is at or above this value (0-100). Leave empty to never fail.
    required: false
    default: "60"
  allow-empty:
    description: >-
      Set to "true" to accept a session folder with no session files: the action prints a notice,
      posts nothing and stays green. The default fails the job, which catches a misconfigured path.
    required: false
    default: "false"
  python-version:
    description: Python version the action installs.
    required: false
    default: "3.11"
  github-token:
    description: "Token that can write pull request comments (needs pull-requests: write). Pull requests from forks get a read-only token: the receipt then goes to the job summary."
    required: false
    default: ${{ github.token }}
outputs:
  risk_score:
    description: Highest risk score across the sessions (0-100).
    value: ${{ steps.receipt.outputs.risk_score }}
  risk_level:
    description: Level of the highest risk score (Low, Medium or High).
    value: ${{ steps.receipt.outputs.risk_level }}
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install RunLedger
      shell: bash
      env:
        RUNLEDGER_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$RUNLEDGER_ACTION_PATH"
    - name: Post the RunLedger receipt
      id: receipt
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        RUNLEDGER_SESSIONS_DIR: ${{ inputs.sessions-dir }}
        RUNLEDGER_FAIL_ON: ${{ inputs.fail-on }}
        RUNLEDGER_ALLOW_EMPTY: ${{ inputs.allow-empty }}
      run: |
        args=(--sessions-dir "$RUNLEDGER_SESSIONS_DIR")
        if [ -n "$RUNLEDGER_FAIL_ON" ]; then
          args+=(--fail-on "$RUNLEDGER_FAIL_ON")
        fi
        if [ "$RUNLEDGER_ALLOW_EMPTY" = "true" ]; then
          args+=(--allow-empty)
        fi
        python -m runledger.github comment "${args[@]}"
