# RunLedger team server with automatic HTTPS (Caddy).
#
# Setup, from this folder:
#   cp .env.example .env                                      # set RUNLEDGER_DOMAIN and RUNLEDGER_PUBLIC_URL
#   docker compose up -d --build
#   docker compose run --rm runledger team create myteam      # prints the team API key once
#
# Only Caddy publishes ports. The RunLedger container is reachable from Caddy only.
# See ../docs/self-hosting.md, and ../docs/hosted.md for running the paid hosted plan.

services:
  runledger:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RUNLEDGER_PUBLIC_URL: ${RUNLEDGER_PUBLIC_URL:?set RUNLEDGER_PUBLIC_URL in deploy/.env}
      # Sets the Secure flag on the dashboard cookie and sends HSTS. The server reads this variable.
      RUNLEDGER_SECURE_COOKIES: "1"
      # Recommended: name the Compose network's subnet as a trusted proxy, so the server reads the
      # client address from X-Forwarded-For and counts each user separately. See ../docs/self-hosting.md
      # ("Trusted proxy on the Compose network") for how to find the subnet.
      RUNLEDGER_TRUSTED_PROXIES: ${RUNLEDGER_TRUSTED_PROXIES:-}
      # Delete runs, approvals and audit events older than this many days. Empty keeps everything.
      RUNLEDGER_RETENTION_DAYS: ${RUNLEDGER_RETENTION_DAYS:-}
      # Hosted plan only (../docs/hosted.md). Leave empty to run without billing.
      RUNLEDGER_POLAR_WEBHOOK_SECRET: ${RUNLEDGER_POLAR_WEBHOOK_SECRET:-}
      RUNLEDGER_POLAR_PRODUCT_IDS: ${RUNLEDGER_POLAR_PRODUCT_IDS:-}
      RUNLEDGER_BILLING_PORTAL_URL: ${RUNLEDGER_BILLING_PORTAL_URL:-}
      RUNLEDGER_RESEND_API_KEY: ${RUNLEDGER_RESEND_API_KEY:-}
      RUNLEDGER_MAIL_FROM: ${RUNLEDGER_MAIL_FROM:-}
      RUNLEDGER_SUPPORT_EMAIL: ${RUNLEDGER_SUPPORT_EMAIL:-}
    volumes:
      - runledger-data:/data
    # Not published on the host. Only the Caddy service can reach this port.
    expose:
      - "8787"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - runledger
    environment:
      RUNLEDGER_DOMAIN: ${RUNLEDGER_DOMAIN:?set RUNLEDGER_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  runledger-data:
  caddy-data:
  caddy-config:
